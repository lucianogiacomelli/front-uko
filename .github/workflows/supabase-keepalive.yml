# Evita que Supabase pause el proyecto del plan gratuito por inactividad (7 días sin actividad en la base).
# Una vez por día hace una consulta real y liviana: lee la fila de contacto por la API pública.
# Necesita los secrets del repositorio SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY (los mismos valores que en .env).
name: Supabase keepalive

on:
  schedule:
    # Todos los días a las 9:17 UTC (6:17 en Argentina)
    - cron: '17 9 * * *'
  # Permite ejecutarlo a mano desde la pestaña Actions
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar la base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Faltan los secrets SUPABASE_URL y/o SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          # --fail: si la API responde con error (por ejemplo, el proyecto ya está pausado), el workflow falla y GitHub avisa por mail
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/contacto?select=id&limit=1"
          echo
          echo "Supabase respondió correctamente"
